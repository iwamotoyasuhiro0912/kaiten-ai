# ============================================================
# 🍣 Kaiten AI Gateway - nginx 設定
# ============================================================
# ・/kaiten-ai/      → kaiten (localhost:8300/)  [ステータス確認]
# ・/kaiten-ai/admin → kaiten (localhost:8300/admin) [Web管理画面]
# ・/kaiten-ai/...   → kaiten (localhost:8300/...) [全APIルート]
# ・/                → n8n   (localhost:5678/) [デフォルト]
# ============================================================

server {
    listen 8079;
    server_name _;

    # ── kaiten-ai ────────────────────────────────────────────
    location /kaiten-ai/ {
        proxy_pass         http://localhost:8300/;
        proxy_http_version 1.1;

        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   X-Forwarded-Prefix /kaiten-ai;

        # WebSocket サポート
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection "upgrade";

        # AI推論は時間がかかるため長めに設定
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # ── n8n (デフォルト) ─────────────────────────────────────
    location / {
        proxy_pass         http://localhost:5678/;
        proxy_http_version 1.1;

        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection "upgrade";

        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
